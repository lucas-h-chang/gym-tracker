<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the page paint under the notch and home
       indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bear Meter</title>

  <!-- Without this the mobile address bar renders white above a #0a0a0f page. -->
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bear Meter">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- The tab icon is the capacity gauge from icon-180.png, inlined as SVG so
       it stays sharp at every size with no extra request. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0f'/%3E%3Cg transform='rotate%28135 50 50%29' fill='none' stroke-width='11' stroke-linecap='round'%3E%3Ccircle cx='50' cy='50' r='32' stroke='%232f2f36' stroke-dasharray='150.8 201.1'/%3E%3Ccircle cx='50' cy='50' r='32' stroke='%236ee7b7' stroke-dasharray='93.5 201.1'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://njhxcwcvyorwqlfacnal.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0a0f;
      --text:       #e8e6e3;
      --sub:        #8a8480;
      --muted:      #4a4540;
      --border:     rgba(255,255,255,0.06);
      --font:       'Inter', -apple-system, sans-serif;
      --mono:       'JetBrains Mono', monospace;
      --cap-green:     #6ee7b7;
      --cap-yellow:    #fbbf24;
      --cap-red:       #f87171;
      --cap-dark-red:  #b91c1c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      /* dvh tracks the iOS Safari URL bar as it retracts; vh is the fallback
         for browsers without it, and undershoots by the bar's height. */
      min-height: 100vh;
      min-height: 100dvh;
      /* Stops iOS inflating body text when the phone is rotated. */
      -webkit-text-size-adjust: 100%;
      /* Backstop against sideways scroll; the tooltip clamp is the actual fix.
         hidden, NOT clip: body's overflow propagates to the viewport (html is
         visible), and a clip on one axis forces the other to clip too, which
         would leave the page unable to scroll vertically. hidden resolves the
         other axis to auto instead. */
      overflow-x: hidden;
    }

    /* ── Data Warning ── */
    #data-warning {
      display: none;
      text-align: center;
      padding: 10px 24px;
      font-size: 11px;
      letter-spacing: 0.05em;
      font-family: var(--mono);
      background: rgba(248, 113, 113, 0.07);
      border-bottom: 1px solid rgba(248, 113, 113, 0.12);
      color: #f87171;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 64px;
      margin-top: 16px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .about-link {
      font-size: 15px;
      font-weight: 500;
      color: var(--sub);
      text-decoration: none;
      transition: color 0.15s;
    }
    .about-link:hover { color: var(--text); }

    /* ── Insight Cards ── */
    .insight-row {
      display: flex;
      gap: 48px;
      padding: 32px 48px 36px;
    }
    .insight-row.hidden { display: none; }
    .insight-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      min-height: 120px;
    }
    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--sub);
      text-transform: uppercase;
      line-height: 1;
    }
    .card-value {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .val-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    /* Mirrors the 10pt Circle() beside the iOS capacity value
       (TodayView.swift:141-145). Desktop never shows it — the phone layout
       turns it on in the media query — so this is inert above 768px. */
    .live-dot {
      display: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
      align-self: center;
      background: var(--sub);
    }
    .card-sub {
      font-size: 14px;
      color: var(--sub);
      line-height: 1.2;
    }
    .card-sub a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Capacity bar */
    .cap-bar-wrap { width: 100%; }
    .cap-bar-track {
      height: 7px;
      background: rgba(255,255,255,0.07);
      border-radius: 4px;
      overflow: hidden;
    }
    .cap-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--cap-green);
      transition: width 0.6s ease, background 0.4s;
    }
    .cap-bar-fill.mid      { background: var(--cap-yellow); }
    .cap-bar-fill.high     { background: var(--cap-red); }
    .cap-bar-fill.critical { background: var(--cap-dark-red); }

    /* Comparison verdict colors */
    .comp-verdict.much-busier  { color: #dc2626; }
    .comp-verdict.busier       { color: #f87171; }
    .comp-verdict.bit-busier   { color: #fca5a5; }
    .comp-verdict.much-quieter { color: #059669; }
    .comp-verdict.quieter      { color: #6ee7b7; }
    .comp-verdict.bit-quieter  { color: #a7f3d0; }
    .comp-verdict.average      { color: var(--text); }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 48px;
    }

    /* ── Chart Sections ── */
    .chart-section {
      position: relative;
      padding: 32px 48px 0;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .chart-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    /* Chart.js's documented responsive setup: the WRAPPER owns the dimensions
       and the canvas is left alone to fill it. Two things depend on that.

       Height: the canvas used to carry height="340", which Chart.js reads once
       at construction to lock an aspect ratio it then preserves forever. Widen
       the window and the chart grew proportionally taller; rotate a phone to
       landscape and the near-square portrait ratio inflated it to ~680px.
       A fixed wrapper height plus maintainAspectRatio:false removes the ratio
       from the picture entirely.

       Sharpness: this rule used to be `width: 100% !important`. Chart.js sizes
       the canvas by writing an inline style.width next to a matching backing
       store canvas.width, and an !important stylesheet rule beats a
       non-important inline style — so the browser stretched whatever bitmap
       was last rendered to fill the container and Chart.js could never correct
       the display size. That mismatch is what showed up as blur on resize. */
    .chart-wrap {
      position: relative;
      height: 340px;
    }
    .chart-wrap canvas {
      display: block;
      /* Scrubbing the chart must not also scroll the page. Without this a drag
         across the curve is claimed by the browser as a vertical pan, so the
         readout jitters while the page slides under your finger. iOS gets the
         same behaviour from GymChart's DragGesture(minimumDistance: 0), which
         consumes the drag before the enclosing ScrollView sees it. */
      touch-action: none;
    }

    /* ── Day Pills ── */
    .day-pills {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .pill {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 7px 18px;
      background: transparent;
      color: var(--sub);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      line-height: 1;
    }
    .pill:hover {
      border-color: rgba(255,255,255,0.22);
      color: var(--text);
    }
    .pill.active {
      background: #ececec;
      border-color: #ececec;
      color: #0a0a0f;
      font-weight: 600;
    }
    .pill-cal {
      letter-spacing: 0.04em;
    }

    /* ── Calendar Popup ── */
    .cal-popup {
      position: absolute;
      background: #141310;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      z-index: 100;
      width: 260px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-month-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .cal-nav-btn {
      background: none;
      border: none;
      color: var(--sub);
      cursor: pointer;
      font-size: 15px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .cal-nav-btn:hover { color: var(--text); }
    .cal-nav-btn:disabled { opacity: 0.2; cursor: default; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-dow {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 4px 0;
      font-weight: 600;
    }
    .cal-day {
      text-align: center;
      padding: 6px 2px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--sub);
      transition: background 0.12s, color 0.12s;
    }
    .cal-day:hover:not(.cal-day-disabled):not(.cal-day-selected) {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }
    .cal-day-disabled { opacity: 0.2; cursor: default; pointer-events: none; }
    .cal-day-selected { background: var(--cap-green); color: #000; font-weight: 700; }
    .cal-day-today { color: var(--cap-green); font-weight: 700; }
    .cal-day-selected.cal-day-today { color: #000; }
    .cal-day-empty { pointer-events: none; }

    /* ── Pulse Dot (live indicator) ── */
    .pulse-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 10;
      --dot-rgb: 110, 231, 183;
    }
    /* Only the expanding halo. The solid dot core is a native canvas point
       (see the Actual dataset's scriptable pointRadius) so it stays perfectly
       glued to the line. This ring is centered on that same point. */
    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: rgba(var(--dot-rgb), 0.35);
      animation: pulse-ring 2s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.8); opacity: 0.9; }
      70%  { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ── Chart Tooltip (custom HTML — sits above the pulse dot, unlike
       Chart.js's canvas-drawn tooltip which the dot always painted over) ── */
    .chart-tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 20;
      background: #1e1c1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
      opacity: 0;
      white-space: nowrap;
    }
    .chart-tooltip .tt-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 6px;
    }
    .chart-tooltip .tt-row {
      font-size: 15px;
      color: var(--text);
      line-height: 1.4;
    }
    .chart-tooltip .tt-row b { font-weight: 700; }

    /* ── Skeleton Loading ── */
    @keyframes skel-pulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.8; }
    }
    .skel {
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      animation: skel-pulse 1.5s ease-in-out infinite;
    }
    /* The bar standing in for a .card-value. Its height lives here rather than
       inline so the phone layout, where the values are 34px and 22px instead of
       desktop's 40px, can shrink it — otherwise the cards would visibly shrink
       the moment real data replaced a too-tall placeholder. */
    .skel-val { height: 42px; }
    .skel-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      /* Top-aligned, not centered: the bars stand in for the label/value/sub
         stack below them, which starts at the top of the card. Centering them
         floated the placeholder ~14px off the text it was standing in for, so
         everything visibly jumped on reveal. */
      justify-content: flex-start;
      gap: 12px;
      padding: 0;
      z-index: 2;
      background: var(--bg);
    }
    body.loading .skel-overlay        { display: flex; }
    body.loading #insight-row         { display: flex !important; }
    body.loading .chart-wrap canvas   { visibility: hidden; }
    /* Hide the real content rather than trusting the overlay to paint over it.
       An opaque box only covers what it happens to overlap, so a card that
       outgrows min-height (a wrapped "VS USUAL WEDNESDAYS", a long verdict)
       leaked text past the bars. Same idiom as the canvas rule above. */
    body.loading .insight-card > *:not(.skel-overlay) { visibility: hidden; }

    /* ── Responsive ──────────────────────────────────────────────
       The phone layout mirrors the iOS app's Today tab
       (RSFApp2.0/Views/TodayView.swift:58-119) so the two products read as one:
       a full-width capacity card over a pair of side-by-side insight cards,
       then a divider, then the chart. Every rule below is scoped to this
       breakpoint — desktop is untouched by all of it. */
    @media (max-width: 768px) {
      /* cardGutter: CGFloat = 20 (CardText.swift). Header, cards, divider,
         and chart all start on the same vertical line, as on iOS.
         The safe-area insets are 0 in portrait and non-zero in landscape, where
         viewport-fit=cover would otherwise let the notch sit over the gutter. */
      #data-warning  { padding: 10px calc(20px + env(safe-area-inset-right)) 10px calc(20px + env(safe-area-inset-left)); }
      header         { padding: 0 calc(20px + env(safe-area-inset-right)) 0 calc(20px + env(safe-area-inset-left)); }
      .divider       { margin: 0 calc(20px + env(safe-area-inset-right)) 0 calc(20px + env(safe-area-inset-left)); }
      /* Title and pills stay on the 20px gutter with the cards above them. */
      .chart-section { padding: 16px calc(20px + env(safe-area-inset-right)) 0 calc(20px + env(safe-area-inset-left)); }

      /* Stacking all three cards pushed the chart ~450px down, below the fold
         on every phone. This is the iOS VStack(spacing: 22) wrapping an
         HStack(alignment: .top, spacing: 16). */
      .insight-row {
        display: grid;
        /* minmax(0, 1fr), not 1fr: a grid item defaults to min-width:auto, so
           the nowrap "VS USUAL THURSDAYS" label sets a floor on its column's
           width and pushes the whole row past the viewport. That is what shows
           up as the page sitting ~20px to the left with its gutter gone, and
           it also stops the label's text-overflow:ellipsis from ever engaging. */
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 16px;
        /* Wider than iOS's 22 because the capacity card ends on a small grey
           sub-line; at 22 the two cards read as attached to it. */
        row-gap: 28px;
        align-items: start;
        /* Asymmetric on purpose: the bottom is tight because .card-sub already
           reserves a line under each value, so the visual gap to the divider is
           bigger than the number suggests. */
        padding: 20px calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
      }
      /* The skeleton state forces display:flex !important to survive
         .insight-row.hidden; without a matching override the placeholder would
         lay out as a flex column and then snap into the grid on first paint. */
      body.loading #insight-row { display: grid !important; }
      #insight-status { grid-column: 1 / -1; }

      /* No min-height on the phone. It was reserving room for a sub-line the
         closed state never fills, which is what left the dead band between the
         two small cards and the divider. Height stability instead comes from
         .card-sub always occupying a line (below), which is how iOS does it:
         CardSub renders " " with .opacity(0) rather than collapsing. */
      .insight-card   { min-height: 0; min-width: 0; gap: 8px; }
      .card-sub       { min-height: 1.25em; }

      /* .inter(34, .bold) and .inter(22, .bold) in TodayView. */
      #insight-pct { font-size: 34px; }
      /* min() is the CSS stand-in for iOS's .lineLimit(1).minimumScaleFactor():
         caps at the iOS size on a normal phone and scales down on narrow ones.
         "Holding steady", the longest value either card shows, needs it — at a
         flat 22px it wraps in a 167px column and drops that card's sub-line
         below its neighbour's, which is exactly the misalignment the nowrap
         and the shared min-height below are there to prevent. */
      #insight-trend-val, #insight-comp-verdict {
        font-size: min(22px, 5.6vw);
        white-space: nowrap;
      }
      #insight-status .skel-val { height: 36px; }
      #insight-trend .skel-val, #insight-comparison .skel-val { height: 24px; }

      .live-dot.on   { display: block; }
      .card-label    { letter-spacing: 1.2px; }  /* CardLabel .kerning(1.2) */

      /* Single-line, as in iOS CardLabel: these two cards sit side by side, and
         a label that wraps in one but not the other pushes its value down and
         breaks the shared baseline. "VS USUAL WEDNESDAYS" is the longest string
         and fits at 10px on a 390px phone; the ellipsis only ever engages on
         something as narrow as an SE. */
      #insight-trend .card-label,
      #insight-comparison .card-label {
        font-size: 10px;
        letter-spacing: 0.8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-sub      { font-size: 13px; }        /* CardSub .inter(13) */
      .cap-bar-track { height: 6px; }            /* CapacityBar frame(height: 6) */

      .chart-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .day-pills {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
        width: 100%;
      }

      /* GymChart is .frame(height: 200), but that 200 is all plot — SwiftUI
         Charts lays its axis labels inside it. Chart.js adds the x-axis row and
         the top padding on top of the plot area, so matching iOS's *plot* means
         a taller box here. */
      .chart-wrap {
        height: 246px;
        /* Bleed out of the section's gutter so the plot runs edge to edge.
           Nothing is lost on the left: Chart.js reserves that strip inside the
           canvas for the "100%"/"75%" labels, so those become the buffer
           instead of empty padding. The right keeps a small 8px margin, since
           the curve itself runs right up to the closing hour. */
        margin-left: calc(-20px - env(safe-area-inset-left));
        margin-right: calc(-12px - env(safe-area-inset-right));
      }

      /* Exactly the iOS pill: .inter(13) with .padding(.horizontal, 18) and
         .padding(.vertical, 8). An earlier pass pushed these to a 40px touch
         target, which overshot the app it is supposed to match — and at 32px
         they are still comfortably tappable. */
      .pill { padding: 8px 18px; font-size: 13px; }

      .cal-popup {
        /* Was a fixed 260px, which left 7 columns of ~35px. Fill the gutters
           instead so the day cells can be square-ish. */
        width: min(320px, calc(100vw - 40px));
        padding: 14px;
        /* The open handler sets right:0 inline, which would put the popup flush
           against the screen edge. Margin isn't part of that inline offset, so
           it's what pulls the popup back onto the 20px gutter. */
        margin-right: calc(20px + env(safe-area-inset-right));
      }
      .cal-day, .cal-dow {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cal-day {
        min-height: 40px;
        padding: 0;
        font-size: 15px;
      }
      .cal-dow { min-height: 28px; padding: 0; }
      .cal-nav-btn {
        min-width: 40px;
        min-height: 40px;
        font-size: 18px;
      }
      .cal-header { margin-bottom: 6px; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="loading">

<div id="data-warning"></div>

<header>
  <div class="logo">Bear Meter</div>
  <a href="about.html" class="about-link">About</a>
</header>

<main>

  <!-- INSIGHT CARDS -->
  <div class="insight-row hidden" id="insight-row">
    <div class="insight-card" id="insight-status">
      <div class="skel-overlay">
        <div class="skel" style="width:60%;height:12px"></div>
        <div class="skel skel-val" style="width:50%;animation-delay:.1s"></div>
        <div class="skel" style="width:100%;height:7px;animation-delay:.15s"></div>
        <div class="skel" style="width:40%;height:12px;animation-delay:.2s"></div>
      </div>
      <span class="card-label" id="insight-status-label">LIVE CAPACITY</span>
      <div class="val-row">
        <span class="live-dot" id="insight-live-dot"></span>
        <span class="card-value" id="insight-pct">&mdash;</span>
        <span class="card-label" id="insight-pct-tag"></span>
      </div>
      <div class="cap-bar-wrap">
        <div class="cap-bar-track"><div class="cap-bar-fill" id="insight-cap-fill" style="width:0%"></div></div>
      </div>
      <span class="card-sub" id="insight-cap-label">&mdash;</span>
    </div>

    <div class="insight-card" id="insight-trend">
      <div class="skel-overlay">
        <div class="skel" style="width:70%;height:12px"></div>
        <div class="skel skel-val" style="width:45%;animation-delay:.1s"></div>
        <div class="skel" style="width:35%;height:14px;animation-delay:.15s"></div>
      </div>
      <span class="card-label">NEXT 30 MIN</span>
      <span class="card-value" id="insight-trend-val">&mdash;</span>
      <span class="card-sub" id="insight-trend-sub"></span>
    </div>

    <div class="insight-card" id="insight-comparison">
      <div class="skel-overlay">
        <div class="skel" style="width:80%;height:12px"></div>

const _ptBounds = {};
function _getPTBounds(year) {
  if (_ptBounds[year]) return _ptBounds[year];
  const mar1       = Date.UTC(year, 2, 1);
  const mar1dow    = new Date(mar1).getUTCDay();
  const firstSunMar = mar1 + (mar1dow === 0 ? 0 : (7 - mar1dow)) * 86400000;
  const dstStart   = firstSunMar + 7 * 86400000 + 10 * 3600000;
  const nov1       = Date.UTC(year, 10, 1);
  const nov1dow    = new Date(nov1).getUTCDay();
  const firstSunNov = nov1 + (nov1dow === 0 ? 0 : (7 - nov1dow)) * 86400000;
  const dstEnd     = firstSunNov + 9 * 3600000;
  return (_ptBounds[year] = { dstStart, dstEnd });
}
function slotTsToKey(slotTs) {
  const ms = Date.parse(slotTs);
  const { dstStart, dstEnd } = _getPTBounds(new Date(ms).getUTCFullYear());
  const ptMs = ms + ((ms >= dstStart && ms < dstEnd) ? -7 : -8) * 3600000;
  const d = new Date(ptMs);
  return (
    d.getUTCFullYear() + '-' +
    String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
    String(d.getUTCDate()).padStart(2, '0') + '_' +
    String(d.getUTCHours()).padStart(2, '0') + ':' +
    String(d.getUTCMinutes()).padStart(2, '0')
  );
}

function slotToLabel(h) {
  const hour   = Math.floor(h);
  const min    = Math.round((h - hour) * 60);
  const period = hour >= 12 ? 'PM' : 'AM';
  const dh     = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
  return min === 0 ? `${dh}:00 ${period}` : `${dh}:${String(min).padStart(2,'0')} ${period}`;
}

const RANGE_DB_TO_DISPLAY = {
  'last_week': 'Last 7 days', 'last_month': 'Last month',
  'last_6_months': 'Last 6 months', 'last_year': 'Last year',
  'all_time': 'All time', 'this_semester': 'This semester',
  // All-time slices partitioned by academic period, for the "compared to
  // usual <Day>s" card (see weekly_builder.py period_type / _emit_day_records).
  'all_summers': 'All summers', 'all_semesters': 'All semesters',
  'all_breaks': 'All breaks',
};

function buildTodayActuals(rows, today) {
  const bins = {};
  rows.forEach(row => {
    const d  = new Date(row.timestamp);
    const pt = new Date(d.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
    const ds = `${pt.getFullYear()}-${String(pt.getMonth()+1).padStart(2,'0')}-${String(pt.getDate()).padStart(2,'0')}`;
    if (ds !== today) return;
    const total   = pt.getHours() * 60 + pt.getMinutes();
    const rounded = Math.round(total / 15) * 15;
    const h = Math.floor(rounded / 60), m = rounded % 60;
    const key = h + m / 60;
    if (!bins[key]) bins[key] = { sum: 0, n: 0, h, m };
    bins[key].sum += row.percent_full;
    bins[key].n   += 1;
  });
  return Object.values(bins)
    .sort((a, b) => (a.h + a.m/60) - (b.h + b.m/60))
    .map(b => ({ x: b.h + b.m/60, y: Math.round(b.sum/b.n*10)/10, label: formatTime(b.h, b.m) }));
}

let liveCapacity  = null;

function getPTNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
}

// Manual JS mirror of academic_calendar.py's SUMMER_RANGES (Python consolidated
// there 2026-07-21 — see CLAUDE.md). This frontend copy and RSFApp2.0's
// TimeUtils.swift are NOT auto-generated from the Python source; keep all
// three in sync by hand when adding a new year.
const SUMMER_RANGES = [
  ['2024-05-10','2024-08-24'], ['2025-05-16','2025-08-23'],
  ['2026-05-15','2026-08-22'], ['2027-05-14','2027-08-21'],
];

function isSummerHours(date) {
  const ds = (date instanceof Date ? date : new Date(date)).toLocaleDateString('en-CA');
  return SUMMER_RANGES.some(([s, e]) => ds >= s && ds <= e);
}

// Manual JS mirror of academic_calendar.py's BREAK_RANGES (winter + spring +
// summer break). Like SUMMER_RANGES above, NOT auto-generated — keep in sync
// by hand when adding a year. Used only by periodTypeOf() to classify TODAY
// for the "compared to usual <Day>s" card, so it mirrors weekly_builder.py's
// period_type() exactly (summer peeled off first via isSummerHours, then a
// non-in-session day is a "break").
const BREAK_RANGES = [
  // winter
  ['2020-12-18','2021-01-18'], ['2021-12-17','2022-01-17'], ['2022-12-16','2023-01-16'],
  ['2023-12-15','2024-01-15'], ['2024-12-20','2025-01-20'], ['2025-12-19','2026-01-19'],
  ['2026-12-18','2027-01-18'], ['2027-12-17','2028-01-17'],
  // spring
  ['2021-03-20','2021-03-28'], ['2022-03-19','2022-03-27'], ['2023-03-25','2023-04-02'],
  ['2024-03-23','2024-03-31'], ['2025-03-22','2025-03-30'], ['2026-03-21','2026-03-29'],
  ['2027-03-20','2027-03-28'], ['2028-03-25','2028-04-02'],
  // summer break (is_semester_day is false across these; summer session is
  // peeled off first by isSummerHours, so these only catch the ~3-day tail
  // between summer session end and the fall academic-hours flip)
  ['2021-05-14','2021-08-24'], ['2022-05-13','2022-08-23'], ['2023-05-12','2023-08-22'],
  ['2024-05-10','2024-08-27'], ['2025-05-16','2025-08-26'], ['2026-05-15','2026-08-25'],
  ['2027-05-14','2027-08-24'],
];

function isSemesterDay(date) {
  const ds = (date instanceof Date ? date : new Date(date)).toLocaleDateString('en-CA');
  return !BREAK_RANGES.some(([s, e]) => ds >= s && ds <= e);
}

// summer / semester / break, matching weekly_builder.py period_type().
function periodTypeOf(date) {
  if (isSummerHours(date))  return 'summer';
  if (!isSemesterDay(date)) return 'break';
  return 'semester';
}

// period_type -> the weekly_averages range_type carrying that all-time slice.
const PERIOD_RANGE_TYPE = {
  summer: 'all_summers', semester: 'all_semesters', break: 'all_breaks',
};

function getOpenHours(jsDay, date) {
  const summer = date != null && isSummerHours(date);
  if (jsDay === 6) return { open: 8, close: 18 };
  if (jsDay === 0) return { open: 8, close: summer ? 20 : 23 };
  return { open: 7, close: summer ? 20 : 23 };
}

function formatHour(h) {
  if (h === 0 || h === 24) return '12 AM';
  if (h === 12) return '12 PM';
  return h > 12 ? `${h - 12} PM` : `${h} AM`;
}

function formatTime(h, m) {
  const period = h >= 12 ? 'PM' : 'AM';
  const dh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
  return m === 0 ? `${dh}:00 ${period}` : `${dh}:${String(m).padStart(2, '0')} ${period}`;
}

function todayPT() {
  const pt = getPTNow();
  return `${pt.getFullYear()}-${String(pt.getMonth()+1).padStart(2,'0')}-${String(pt.getDate()).padStart(2,'0')}`;
}

function pctColor(p) {
  if (p >= 90) return '#b91c1c';
  if (p >= 80) return '#f87171';
  if (p >= 60) return '#fbbf24';
  return '#6ee7b7';
}

function pctColorRGB(p) {
  if (p >= 90) return '185, 28, 28';
  if (p >= 80) return '248, 113, 113';
  if (p >= 60) return '251, 191, 36';
  return '110, 231, 183';
}

// Custom HTML tooltip renderer, replacing Chart.js's canvas-drawn tooltip.
// Needed so (a) it can sit above the pulse dot via z-index instead of the
// dot always painting over it, and (b) the numeric value can be bolded —
// canvas tooltips render each line in one uniform font, no per-word styling.
function makeExternalTooltip(tooltipId) {
  return (context) => {
    const el = document.getElementById(tooltipId);
    if (!el) return;
    const tt = context.tooltip;

    if (tt.opacity === 0) {
      el.style.opacity = 0;
      return;
    }

    let html = '';
    if (tt.title?.length) {
      html += `<div class="tt-title">${tt.title[0]}</div>`;
    }
    (tt.body || []).forEach(b => {
      b.lines.forEach(line => {
        const bolded = line.replace(/\d+/, (m) => `<b>${m}</b>`);
        html += `<div class="tt-row">${bolded}</div>`;
      });
    });
    el.innerHTML = html;

    // Measure off-screen first so we know which side to place the box on.
    el.style.left = '0px';
    el.style.top  = '0px';
    const w = el.offsetWidth;
    const h = el.offsetHeight;

    const gap = 14;
    const chartArea = context.chart.chartArea;
    // The wrapper, not the plot area, is what the box can actually overflow —
    // it's the positioning context, and anything past its right edge scrolls
    // the whole page sideways on a phone.
    const wrap = el.parentElement;
    const wrapW = wrap.clientWidth;
    const wrapH = wrap.clientHeight;

    let left, top;
    if (wrapW < 480) {
      // Too narrow to put a ~170px nowrap box beside the caret on either side,
      // so sit it above the point and centre it instead.
      left = tt.caretX - w / 2;
      top  = tt.caretY - h - gap;
      // Above the plot area there's only the 36px of layout padding, so if the
      // point is near the top the box has to flip below it.
      if (top < 0) top = tt.caretY + gap;
    } else {
      const preferLeft = tt.caretX - w - gap >= chartArea.left;
      left = preferLeft ? (tt.caretX - w - gap) : (tt.caretX + gap);
      top  = tt.caretY - h / 2;
    }

    // Clamp last, so every branch above is guaranteed to land inside the wrapper.
    el.style.left = Math.max(0, Math.min(left, wrapW - w)) + 'px';
    el.style.top  = Math.max(0, Math.min(top,  wrapH - h)) + 'px';
    el.style.opacity = 1;
  };
}

// ── Status ─────────────────────────────────────────────────────
function updateStatusBar() {
  const pt = getPTNow();
  const { open, close } = getOpenHours(pt.getDay(), pt);
  const isOpen = pt.getHours() >= open && pt.getHours() < close;
  if (!isOpen) return Promise.resolve();

  // The promise is returned so wake() can wait on this and the forecast
  // refresh together. Without that, coming back to a tab paints a fresh live %
  // against a forecast that's still minutes old, and computeTrend() reads the
  // difference as a real move.
  return fetch('/api/live-capacity')
    .then(r => r.json())
    .then(d => {
      const pct = Math.round(d.capacity_pct);
      const count = Math.round((pct / 100) * 150);
      liveCapacity = { count, pct };
      if (window._insightData) renderInsightCards(window._insightData);
    })
    .catch(() => {});
}

// ── Prediction Chart ───────────────────────────────────────────
let predChart = null;
let predDate  = '';

function isPhone() { return window.innerWidth <= 768; }

// iOS keeps every 2nd hour on a phone (GymChart: stride(from:through:by: 2))
// and affords it by dropping the space: "7AM", not "7 AM". Same trick here, so
// the web shows the app's tick density instead of thinning to every 3rd hour.
function formatHourTick(h) {
  return isPhone() ? formatHour(h).replace(' ', '') : formatHour(h);
}

// Top padding gives the pulse dot's halo room above a near-100% curve. 36px of
// a 340px chart is fine; the same 36px eats an eighth of the phone's box.
function chartTopPad() { return isPhone() ? 22 : 36; }

// Re-resolve the breakpoint-dependent options on rotation or a window drag.
// Chart.js re-renders on resize via its own ResizeObserver, but the top padding
// is read once into the options object, and the tick callbacks
// (formatHourTick, the y-axis afterBuildTicks) only re-run on an update — so
// crossing 768 has to force one.
let _wasPhone = isPhone();
window.addEventListener('resize', () => {
  if (!predChart) return;
  const pad     = chartTopPad();
  const phoneNow = isPhone();
  if (predChart.options.layout.padding.top === pad && phoneNow === _wasPhone) return;
  _wasPhone = phoneNow;
  predChart.options.layout.padding.top = pad;
  predChart.update('none');
});

function shiftDate(dateStr, delta) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function chartTitle(dateStr) {
  const today = todayPT();
  if (dateStr === today) return "Today's Crowd";
  if (dateStr === shiftDate(today, 1)) return "Tomorrow's Crowd";
  const d = new Date(dateStr + 'T12:00:00');
  return `${DAYS[d.getDay()]}'s Crowd`;
}

function buildPredPoints(data, dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const { open, close } = getOpenHours(d.getDay(), d);
  const points = [];
  for (let h = open; h < close; h++) {
    for (const m of [0, 15, 30, 45]) {
      const key = `${dateStr}_${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const pred = data.predictions[key];
      if (pred == null) continue;
      points.push({ x: h + m / 60, y: Math.round(pred * 10) / 10, label: formatTime(h, m) });
    }
  }
  points.push({ x: close, y: 0, label: formatTime(close, 0) });
  return points;
}

// ── Chart.js Plugins ─────────────────────────────────────────

// Gradient that maps chart color to capacity value (green → yellow → red)
const capacityGradientPlugin = {
  id: 'capacityGradient',
  // Chart.js resolves each line's fill color from dataset.backgroundColor
  // during the *update* phase (before Filler ever draws), not the draw
  // phase — so this must run in beforeDatasetsUpdate, not beforeDatasetsDraw,
  // or the gradient lags one full update cycle behind (invisible on first load).
  beforeDatasetsUpdate(chart) {
    if (!chart.options.plugins?.capacityGradient?.enabled) return;
    const { ctx, scales } = chart;
    if (!scales?.y) return;

    const yBottom = scales.y.getPixelForValue(0);
    const yTop    = scales.y.getPixelForValue(110);

    chart.data.datasets.forEach((ds, i) => {
      const lineOp = ds._predicted ? 0.55 : 1.0;
      const fillOp = ds._predicted ? 0.15 : 0.35;

      const lg = ctx.createLinearGradient(0, yBottom, 0, yTop);
      lg.addColorStop(0,       `rgba(110,231,183,${lineOp})`);
      lg.addColorStop(45/110,  `rgba(110,231,183,${lineOp})`);
      lg.addColorStop(60/110,  `rgba(251,191,36,${lineOp})`);
      lg.addColorStop(80/110,  `rgba(248,113,113,${lineOp})`);
      lg.addColorStop(1,       `rgba(185,28,28,${lineOp})`);
      ds.borderColor = lg;

      const fg = ctx.createLinearGradient(0, yBottom, 0, yTop);
      fg.addColorStop(0,       `rgba(110,231,183,${fillOp * 0.1})`);
      fg.addColorStop(0.08,    `rgba(110,231,183,${fillOp * 0.45})`);
      fg.addColorStop(45/110,  `rgba(110,231,183,${fillOp})`);
      fg.addColorStop(60/110,  `rgba(251,191,36,${fillOp})`);
      fg.addColorStop(80/110,  `rgba(248,113,113,${fillOp})`);
      fg.addColorStop(1,       `rgba(185,28,28,${fillOp})`);
      ds.backgroundColor = fg;
    });
  }
};

// NOW indicator: pulsing dot at the live point (positioned via CSS element).
// The live point itself — same x/y the actual line is extended to and the
// predicted line bridges from in updatePredChart() — is what's rendered
// here, so the dot always sits exactly where the two lines meet.
const nowLinePlugin = {
  id: 'nowLine',
  afterDatasetsDraw(chart) {
    const opts = chart.options.plugins.nowLine;
    const pulseDot = document.getElementById('pulse-dot');

    if (!opts?.show) {
      if (pulseDot) pulseDot.style.display = 'none';
      return;
    }

    const actualData = chart.data.datasets[0]?.data || [];
    const lastPt = actualData[actualData.length - 1];
    if (!lastPt) {
      if (pulseDot) pulseDot.style.display = 'none';
      return;
    }

    positionPulseDot(chart, lastPt);
  }
};

function positionPulseDot(chart, lastPt) {
  const pulseDot = document.getElementById('pulse-dot');
  if (!pulseDot) return;

  // The solid core is drawn on the canvas as a native point; this element is
  // only the pulsing halo. Keep it hidden until the chart is actually visible
  // (canvas is visibility:hidden during body.loading) so it never flashes in
  // empty space before the chart's entrance animation runs.
  if (document.body.classList.contains('loading')) {
    pulseDot.style.display = 'none';
    return;
  }

  const { scales } = chart;
  const dotX = scales.x.getPixelForValue(lastPt.x);
  const dotY = scales.y.getPixelForValue(lastPt.y);

  pulseDot.style.display = 'block';
  pulseDot.style.left = (dotX - 7) + 'px';
  pulseDot.style.top  = (dotY - 7) + 'px';
  pulseDot.style.setProperty('--dot-rgb', pctColorRGB(lastPt.y));
}

// The chart's data only advances when updatePredChart() re-runs (page load,
// day switch), so without this the live point — and the dot sitting on it —
// would freeze at whatever time the page happened to load. Recompute it
// every 15s so the line, its fill, and the dot all keep creeping forward
// together and never drift apart.
setInterval(() => {
  if (!predChart || predDate !== todayPT()) return;
  if (!window._insightData) return;
  updatePredChart(window._insightData);
  // computeTrend() subtracts a forecast slot from the *live* reading, so the
  // moment those two describe different instants the card doesn't just go
  // stale, it inverts: a live 42% against a forecast still holding 31% reads
  // as "Getting quieter" while the gym is filling. Re-render on the same tick
  // as the chart so both halves of that subtraction always agree on "now".
  renderInsightCards(window._insightData);
}, 15000);

// ── Today's data refresh ─────────────────────────────────────
// The 15s tick above only redraws from data already in memory, and
// updateStatusBar() only refreshes the single live-% reading. Neither pulls
// new capacity_log rows, so a tab left open draws one straight line from
// whatever bin was loaded at boot to the live point, and the real curve in
// between never fills in. Re-pull the two tables that actually change during
// the day: capacity_log (scraper.py, every 15 min) and today_summary
// (today_builder.py, every 15 min). predictions and weekly_averages are
// daily/nightly builds, so they stay as loaded.
let bootDate = '';
let refreshInFlight = false;
let lastRefreshAt = 0;

async function refreshTodayData() {
  const data = window._insightData;
  if (!data) return;

  // Returning to a tab can fire visibilitychange, focus and pageshow within
  // milliseconds of each other. Collapse them so one trip back is one fetch,
  // not three, and so the 5-min timer can't overlap a wake-up refresh.
  if (refreshInFlight || Date.now() - lastRefreshAt < 10000) return;

  // The date rolled over while the tab sat open. Day pills, calendar bounds
  // and the whole prediction window are built around the boot-time date, so
  // reloading is the only honest way to move to the new day. Rare by
  // definition (once per open tab, at midnight PT).
  if (todayPT() !== bootDate) {
    location.reload();
    return;
  }

  refreshInFlight = true;

  // Narrower than the boot query, which starts at yesterday 12:00Z purely as
  // a safe margin. buildTodayActuals() discards everything that isn't today
  // PT anyway, and PT is UTC-7/-8, so today's PT midnight is always >= today
  // 00:00Z. Halving the payload matters here because this repeats all day.
  let actualsRows, todaySummaryRows;
  try {
    [actualsRows, todaySummaryRows] = await Promise.all([
      sbFetch(`capacity_log?timestamp=gte.${bootDate}T00:00:00Z&order=timestamp.asc&limit=2000`),
      sbFetch(`today_summary?date=eq.${bootDate}&select=similarity_preds,blend_weight,computed_at`),
    ]);
  } catch (e) {
    // Offline, or a Supabase blip. Keep rendering what we already have and
    // let the next tick retry rather than blanking a working page.
    console.error('refreshTodayData failed:', e);
    return;
  } finally {
    refreshInFlight = false;
    lastRefreshAt = Date.now();
  }

  data.today_actuals = buildTodayActuals(actualsRows, bootDate);

  const ts = todaySummaryRows[0] || {};
  data.today_similarity_preds = ts.similarity_preds || [];
  data.today_blend_weight     = ts.blend_weight || 0;

  if (predDate === bootDate) updatePredChart(data);
  renderInsightCards(data);
}

// Scrub line on hover
const scrubLinePlugin = {
  id: 'scrubLine',
  afterDraw(chart) {
    const active = chart.tooltip?.getActiveElements();
    if (!active || !active.length) return;
    const { ctx, chartArea: a } = chart;
    const x = active[0].element.x;
    if (x < a.left || x > a.right) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, a.top);
    ctx.lineTo(x, a.bottom);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
};

// ── Day Pills ────────────────────────────────────────────────
function buildPillDates() {
  const today = todayPT();
  const pills = [
    { label: 'Today', date: today },
    { label: 'Tomorrow', date: shiftDate(today, 1) },
  ];
  for (let i = 2; i <= 4; i++) {
    const d = new Date(shiftDate(today, i) + 'T12:00:00');
    pills.push({
      label: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()],
      date: shiftDate(today, i)
    });
  }
  return pills;
}

function renderPills(data) {
  const container = document.getElementById('day-pills');
  const pills = buildPillDates();
  container.innerHTML = '';

  pills.forEach(p => {
    const btn = document.createElement('button');
    btn.className = `pill${p.date === predDate ? ' active' : ''}`;
    btn.textContent = p.label;
    btn.dataset.date = p.date;
    btn.addEventListener('click', () => {
      predDate = p.date;
      updatePredChart(data);
      renderInsightCards(data);
      updatePillStates();
    });
    container.appendChild(btn);
  });

  const calBtn = document.createElement('button');
  calBtn.className = 'pill pill-cal';
  calBtn.textContent = 'More';
  calBtn.id = 'cal-trigger';
  if (!pills.some(p => p.date === predDate)) calBtn.classList.add('active');
  container.appendChild(calBtn);
}

function updatePillStates() {
  const pills = buildPillDates();
  document.querySelectorAll('.pill').forEach(el => {
    if (el.classList.contains('pill-cal')) {
      el.classList.toggle('active', !pills.some(p => p.date === predDate));
    } else {
      el.classList.toggle('active', el.dataset.date === predDate);
    }
  });
}

// ── Prediction Chart ─────────────────────────────────────────
function updatePredChart(data) {
  const today    = todayPT();
  const isToday  = predDate === today;
  const pt       = getPTNow();
  const nowVal   = pt.getHours() + pt.getMinutes() / 60;
  const predDay  = new Date(predDate + 'T12:00:00');
  const xMin     = 7;
  const xMax     = 23;

  // The pulse dot sits on the live point at "now". Past closing (or before
  // open) there's no actual line for it to cap, so it would float alone in
  // empty space — only show it while the gym is actually open.
  const { open: openH, close: closeH } = getOpenHours(predDay.getDay(), predDay);
  const gymIsOpen = pt.getHours() >= openH && pt.getHours() < closeH;
  const showNow   = isToday && gymIsOpen;

  const allPredPoints = buildPredPoints(data, predDate);
  const actualPoints = isToday
    ? (data.today_actuals || []).filter(p => p.x <= nowVal)
    : [];
  let predPoints = isToday
    ? allPredPoints.filter(p => p.x >= nowVal)
    : allPredPoints;

  if (isToday && data.today_similarity_preds?.length) {
    // Blend weight is per-slot ('w'): full trust near the last observation,
    // decaying to the base curve within ~2h (see today_builder.py). Fall back
    // to the scalar blend_weight for older cached rows that lack per-point w.
    const simMap = {};
    data.today_similarity_preds.forEach(p => { simMap[p.x] = p; });
    predPoints = predPoints.map(p => {
      const sim = simMap[p.x];
      if (sim == null) return p;
      const w = sim.w != null ? sim.w : (data.today_blend_weight || 0);
      return { ...p, y: Math.round(((1 - w) * p.y + w * sim.y) * 10) / 10 };
    });
  }

  // Extend the actual line all the way to "right now" (not just the last
  // completed 15-min bin) using the live capacity reading, then bridge the
  // predicted line from that exact same point. This is also what the pulse
  // dot renders on top of, so the line, its fill, and the dot all meet at
  // one spot instead of the dot floating off the end of the line — and the
  // sliver of time between the last bin and now gets shaded as "actual"
  // since it's already passed, instead of being left blank.
  if (isToday && actualPoints.length && gymIsOpen) {
    const lastActual = actualPoints[actualPoints.length - 1];
    const liveX = Math.min(Math.max(nowVal, lastActual.x), xMax);
    const liveY = liveCapacity ? liveCapacity.pct : lastActual.y;
    const livePoint = { x: liveX, y: liveY, label: formatTime(pt.getHours(), pt.getMinutes()) };

    if (liveX > lastActual.x) {
      actualPoints.push(livePoint);
    } else {
      actualPoints[actualPoints.length - 1] = livePoint;
    }
    if (!predPoints.length || predPoints[0].x > liveX) {
      predPoints = [livePoint, ...predPoints];
    }
  } else if (isToday && actualPoints.length && nowVal >= closeH) {
    // Day is over. There's no live point to extend to, and the predicted
    // (close, 0) point was filtered out by p.x >= nowVal, so the actual line
    // would otherwise end flat at its last non-zero reading. Drop it to 0 at
    // close so today looks like every other finished day.
    const lastActual = actualPoints[actualPoints.length - 1];
    if (lastActual.x < closeH) {
      actualPoints.push({ x: closeH, y: 0, label: formatTime(closeH, 0) });
    } else {
      actualPoints[actualPoints.length - 1] = { x: closeH, y: 0, label: formatTime(closeH, 0) };
    }
  }

  document.getElementById('chart-title').textContent = chartTitle(predDate);
  updatePillStates();

  if (predChart) {
    predChart.data.datasets[0].data = actualPoints;
    predChart.data.datasets[1].data = predPoints;
    predChart.options.plugins.nowLine.show  = showNow;
    predChart.options.plugins.nowLine.value = nowVal;
    predChart.options.scales.x.min          = xMin;
    predChart.options.scales.x.max          = xMax;
    predChart.update();
    return;
  }

  const canvasEl = document.getElementById('pred-chart');
  const ctx = canvasEl.getContext('2d');

  // Chart.js's default event list is
  // ['mousemove','mouseout','click','touchstart','touchmove'] — no touchend.
  // Nothing ever tells it a touch finished, so the last touched point stays
  // active and the readout hangs there after you lift your finger. iOS clears
  // it in DragGesture's .onEnded; this is the equivalent.
  //
  // Two things are needed, and an earlier pointerup version had only the
  // second: preventDefault on touchend suppresses the synthetic mousemove
  // Safari fires afterwards at the same coordinates, which would otherwise
  // re-activate the point immediately after it was cleared. mouseout is then
  // Chart.js's own reset path (_handleEvent forces active = [] for it), which
  // clears the tooltip and the scrub line together.
  if (!canvasEl.dataset.liftBound) {
    canvasEl.dataset.liftBound = '1';
    const endTouch = (e) => {
      if (e.cancelable) e.preventDefault();
      canvasEl.dispatchEvent(new MouseEvent('mouseout', { bubbles: true }));
    };
    canvasEl.addEventListener('touchend', endTouch, { passive: false });
    canvasEl.addEventListener('touchcancel', endTouch, { passive: false });
  }

  predChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'Actual',
          data: actualPoints,
          borderColor: '#6ee7b7',
          backgroundColor: 'transparent',
          borderWidth: 3.25,
          // The live "now" dot is rendered as a native point on the last actual
          // point (the live point built in updatePredChart), so it animates in
          // with the line and stays glued to the exact seam where actual meets
          // predicted, with no DOM overlay drifting off the curve. Only shown
          // while the gym is open (nowLine.show); the DOM .pulse-dot adds the halo.
          pointRadius: (c) => {
            const show = c.chart.options.plugins?.nowLine?.show;
            return (show && c.dataIndex === c.dataset.data.length - 1) ? 5 : 0;
          },
          pointHoverRadius: 5,
          pointBackgroundColor: (c) => {
            const isLast = c.dataIndex === c.dataset.data.length - 1;
            const y = c.dataset.data[c.dataIndex]?.y;
            return (isLast && y != null) ? `rgb(${pctColorRGB(y)})` : '#fff';
          },
          pointBorderColor: 'transparent',
          pointBorderWidth: 0,
          tension: 0.35,
          fill: true,
          order: 1,
        },
        {
          label: 'Predicted',
          data: predPoints,
          borderColor: '#9ca3af',
          backgroundColor: 'transparent',
          borderWidth: 2.6,
          borderDash: [6, 5],
          // Round caps and joins. The dash pattern already matched GymChart's
          // dash: [6, 5], but Chart.js defaults to butt caps and miter joins
          // while iOS strokes with StrokeStyle(lineCap: .round, lineJoin:
          // .round) — which is the whole reason the same numbers read as hard
          // rectangles here and soft lozenges in the app.
          borderCapStyle: 'round',
          borderJoinStyle: 'round',
          pointRadius: 0,
          pointHoverRadius: 5,
          pointBackgroundColor: '#fff',
          pointBorderColor: 'transparent',
          tension: 0.35,
          fill: true,
          order: 2,
          _predicted: true,
        }
      ]
    },
    options: {
      parsing: false,
      // The .chart-wrap height is the single source of truth for how tall the
      // chart is (see its CSS comment). Without this Chart.js would re-derive a
      // height from an aspect ratio and fight the wrapper.
      maintainAspectRatio: false,
      animation: { duration: 320 },
      layout: { padding: { top: chartTopPad() } },
      interaction: { mode: 'nearest', intersect: false, axis: 'x' },
      plugins: {
        capacityGradient: { enabled: true },
        nowLine: { show: showNow, value: nowVal },
        legend:  { display: false },
        tooltip: {
          enabled: false,
          external: makeExternalTooltip('pred-tooltip'),
          displayColors: false,
          filter: (item) => {
            // Drop the synthetic connector point that bridges the actual line
            // into the predicted line (same x/y as the last actual reading) —
            // without this, hovering right at the seam shows "Actual" and
            // "Predicted" twice with an identical, confusing value.
            if (item.datasetIndex !== 1) return true;
            const actualData = item.chart.data.datasets[0].data;
            const lastActual = actualData[actualData.length - 1];
            return !(lastActual && item.raw.x === lastActual.x && item.raw.y === lastActual.y);
          },
          callbacks: {
            title: (items) => items[0].raw.label || '',
            label: (item) => `${item.dataset.label}: ${Math.round(item.raw.y)}%`,
          }
        }
      },
      scales: {
        x: {
          type: 'linear', min: xMin, max: xMax,
          grid: { display: false },
          border: { display: false },
          ticks: {
            color: '#5a5550',
            font: { size: 11, family: "'Inter', sans-serif", weight: '500' },
            stepSize: 2,
            padding: 8,
            callback: (v) => Number.isInteger(v) ? formatHourTick(v) : ''
          }
        },
        y: {
          min: 0, max: 110,
          grid: { color: 'rgba(255,255,255,0.04)', drawTicks: false },
          border: { display: false },
          // The 110 ceiling is headroom for the curve, not a value worth
          // labelling, but Chart.js includes the bound by default and prints
          // "110%" jammed against "100%". iOS lists its ticks explicitly
          // (AxisMarks(values: [25, 50, 75, 100])); match that on the phone,
          // where the collision is worst. Desktop is left as-is deliberately.
          afterBuildTicks: (axis) => {
            if (isPhone()) {
              axis.ticks = [25, 50, 75, 100].map(value => ({ value }));
            }
          },
          ticks: {
            color: '#5a5550',
            font: { size: 10, family: "'Inter', sans-serif", weight: '500' },
            stepSize: 25,
            padding: 8,
            callback: (v) => v > 0 ? `${v}%` : ''
          }
        }
      }
    }
  });
}

// ── Data Warning ──────────────────────────────────────────────
function showDataWarning(msg) {
  const el = document.getElementById('data-warning');
  el.textContent = msg;
  el.style.display = 'block';
}

// ── Insight Cards ─────────────────────────────────────────────
// Half-open [fromH, toH) by default, which is what the full-day curve wants:
// called with the closing hour, it must stop at the last slot INSIDE opening
// hours (10:45 PM), not draw a point at the moment the doors shut.
//
// `includeEnd` closes the interval to [fromH, toH], for the "next 30 min" card.
// That window is 30 minutes because the card says so, and excluding its far edge
// meant that on an exact quarter-hour — 4:00, 4:15, … — the last slot considered
// was only 15 minutes out while the label still promised 30.
function getBlendedSlots(data, fromH, toH, date, includeEnd = false) {
  const dateStr = date || todayPT();
  const isToday = dateStr === todayPT();
  const simMap = {};
  if (isToday && data.today_similarity_preds) {
    data.today_similarity_preds.forEach(p => { simMap[p.x] = p; });
  }
  const slots = [];
  for (let h = Math.floor(fromH); h <= Math.floor(toH); h++) {
    for (const m of [0, 15, 30, 45]) {
      const slotH = h + m / 60;
      if (slotH < fromH || (includeEnd ? slotH > toH : slotH >= toH)) continue;
      const key  = `${dateStr}_${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const pred = data.predictions[key];
      if (pred == null) continue;
      const sim     = simMap[slotH];
      const w       = sim ? (sim.w != null ? sim.w : (data.today_blend_weight || 0)) : 0;
      const blended = sim ? (1 - w) * pred + w * sim.y : pred;
      slots.push({ h, m, slotH, y: blended });
    }
  }
  return slots;
}

function computeTrend(data, livePct) {
  const isToday = predDate === todayPT();
  const d = new Date(predDate + 'T12:00:00');
  const { open, close } = getOpenHours(d.getDay(), d);

  let fromH, toH, sub;
  if (isToday) {
    const pt  = getPTNow();
    const nowH = pt.getHours() + pt.getMinutes() / 60;
    if (close - nowH < 0.5) return null;
    fromH = nowH;
    toH   = Math.min(nowH + 0.5, close);
    sub   = null;
  } else {
    fromH = open;
    toH   = Math.min(open + 0.5, close);
    sub   = 'first 30 min · projected';
  }

  const slots = getBlendedSlots(data, fromH, toH, predDate, true);
  if (slots.length < 2) return null;

  const startY = (isToday && livePct != null) ? livePct : slots[0].y;
  const endY   = slots[slots.length - 1].y;
  const delta  = endY - startY;

  const dir = Math.abs(delta) < 5 ? 'flat' : delta > 0 ? 'up' : 'down';
  const lastSlot = slots[slots.length - 1];
  return { dir, delta: Math.round(delta), startY: Math.round(startY), endY: Math.round(endY), toH: lastSlot.h, toMin: lastSlot.m, sub };
}

function computeDayComparisonAt(dayName, qH, data, forDate) {
  function getWeeklyAt(key, h) {
    const arr = data.weekly[key];
    if (!arr) return null;
    const pt = arr.find(p => p.x === h);
    return pt ? pt.y : null;
  }
  // Compare against the same KIND of day: a summer Thursday vs usual summer
  // Thursdays, an in-session one vs usual semester Thursdays, a break day vs
  // usual break days. (The old "This semester only" slice went blank every
  // summer, since there are no in-session days to average.)
  const period    = periodTypeOf(forDate);
  const rangeType = PERIOD_RANGE_TYPE[period];
  const disp      = RANGE_DB_TO_DISPLAY[rangeType] || rangeType;
  return {
    period,
    baseline: getWeeklyAt(`${dayName}|${disp}|false`, qH),
  };
}

function renderInsightCards(data) {
  const row = document.getElementById('insight-row');
  row.classList.remove('hidden');

  const isToday   = predDate === todayPT();
  const pt        = getPTNow();
  const predDay   = new Date(predDate + 'T12:00:00');
  const dayName   = DAYS[predDay.getDay()];
  const livePct   = liveCapacity ? liveCapacity.pct : null;
  const liveCount = liveCapacity ? liveCapacity.count : null;

  const { open: openH, close: closeH } = getOpenHours(predDay.getDay(), predDay);

  // ── Card 1: Status / Capacity ──
  const statusLabel = document.getElementById('insight-status-label');
  const pctEl       = document.getElementById('insight-pct');
  const pctTagEl    = document.getElementById('insight-pct-tag');
  const capFill     = document.getElementById('insight-cap-fill');
  const capLabel    = document.getElementById('insight-cap-label');
  const liveDotEl   = document.getElementById('insight-live-dot');
  pctTagEl.textContent = '';

  // Only rendered on the phone layout (see .live-dot). display, not opacity:
  // iOS reserves the dot's slot with .opacity(0), but on the web that left
  // "CLOSED" indented 16px past the LIVE CAPACITY label above it and the
  // "Opens tomorrow at" line below it, which read as a misalignment bug.
  // Removing it from the flow keeps every closed/error state flush left.
  // A class, not an inline display: an inline style would beat the base
  // `.live-dot { display: none }` and leak the dot onto desktop, which never
  // shows it.
  const setLiveDot = (color) => {
    liveDotEl.style.background = color || 'transparent';
    liveDotEl.classList.toggle('on', !!color);
  };
  setLiveDot(null);

  if (isToday) {
    const gymIsOpen = pt.getHours() >= openH && pt.getHours() < closeH;
    statusLabel.textContent = 'LIVE CAPACITY';

    if (gymIsOpen && livePct != null) {
      pctEl.textContent = `${livePct.toFixed(0)}%`;
      pctEl.style.color = pctColor(livePct);
      setLiveDot(pctColor(livePct));

      const fillCls = livePct >= 90 ? 'critical' : livePct >= 80 ? 'high' : livePct >= 60 ? 'mid' : '';
      capFill.style.width = `${Math.min(livePct, 100)}%`;
      capFill.className = `cap-bar-fill${fillCls ? ' ' + fillCls : ''}`;

      if (livePct >= 95) {
        capLabel.innerHTML = `${liveCount} / 150 people · <a href="https://417804.waitwell.us/join/48" target="_blank" rel="noopener">Join virtual queue</a>`;
      } else {
        capLabel.textContent = `${liveCount} / 150 people`;
      }
    } else if (gymIsOpen) {
      pctEl.textContent = '—';
      pctEl.style.color = 'var(--sub)';
      capFill.style.width = '0%';
      capLabel.textContent = 'Live count unavailable';
    } else {
      const nowH = pt.getHours() + pt.getMinutes() / 60;
      const isBeforeOpen = nowH < openH;
      const tomorrow = new Date(pt.getTime() + 24 * 60 * 60 * 1000);
      const nextOpen = isBeforeOpen ? openH : getOpenHours(tomorrow.getDay(), tomorrow).open;
      const prefix   = isBeforeOpen ? 'Opens at' : 'Opens tomorrow at';

      pctEl.textContent = 'CLOSED';
      pctEl.style.color = '#f87171';
      pctEl.style.fontSize = '';
      capFill.style.width = '0%';
      capLabel.textContent = `${prefix} ${formatTime(nextOpen, 0)}`;
    }
  } else {
    statusLabel.textContent = 'DAILY FORECAST';
    const allSlots = getBlendedSlots(data, openH, closeH, predDate);
    if (allSlots.length) {
      const peak = allSlots.reduce((a, b) => b.y > a.y ? b : a);
      pctEl.textContent = `${Math.round(peak.y)}%`;
      pctEl.style.color = pctColor(peak.y);
      pctTagEl.textContent = 'PEAK';
      const fillCls = peak.y >= 90 ? 'critical' : peak.y >= 80 ? 'high' : peak.y >= 60 ? 'mid' : '';
      capFill.style.width = `${Math.min(peak.y, 100)}%`;
      capFill.className = `cap-bar-fill${fillCls ? ' ' + fillCls : ''}`;
      capLabel.textContent = `${formatTime(openH, 0)} – ${formatTime(closeH, 0)}`;
    } else {
      pctEl.textContent = '—';
      pctEl.style.color = 'var(--sub)';
      capFill.style.width = '0%';
      capLabel.textContent = '—';
    }
  }

  // ── Card 2: Trend (Next 30 min) ──
  const trendValEl = document.getElementById('insight-trend-val');
  const trendSubEl = document.getElementById('insight-trend-sub');
  const trend = computeTrend(data, livePct);

  if (trend && isToday) {
    const labels  = { up: 'Filling up', down: 'Clearing out', flat: 'Holding steady' };
    const dirColor = trend.dir === 'up' ? '#f87171' : trend.dir === 'down' ? '#6ee7b7' : 'var(--text)';
    trendValEl.textContent = labels[trend.dir];
    trendValEl.style.color = dirColor;

    // Magnitude only — the arrow already carries the direction — plus the time
    // the window actually ends (computeTrend's last slot), so the number reads
    // as a forecast to a moment rather than floating free. Kept identical to
    // RSFApp2.0's TodayView trendCard.
    const arrows = { up: '↑', down: '↓', flat: '→' };
    const subColor = trend.dir === 'up' ? '#f87171' : trend.dir === 'down' ? '#6ee7b7' : 'var(--sub)';
    const byTime = formatTime(trend.toH, trend.toMin);
    trendSubEl.innerHTML = `<span style="color:${subColor}">${arrows[trend.dir]} ${Math.abs(trend.delta)}% by ${byTime}</span>`;
  } else {
    trendValEl.textContent = '—';
    trendValEl.style.color = 'var(--sub)';
    trendSubEl.textContent = '';
  }

  // ── Card 3: Comparison (vs usual day of this same period type) ──
  const compHeaderEl  = document.getElementById('insight-comp-header');
  const compVerdictEl = document.getElementById('insight-comp-verdict');
  const compDeltaEl   = document.getElementById('insight-comp-delta');

  compHeaderEl.textContent = `VS USUAL ${dayName.toUpperCase()}S`;

  const cmpH = isToday
    ? Math.round((pt.getHours() + pt.getMinutes() / 60) * 4) / 4
    : 12;
  const cmp = computeDayComparisonAt(dayName, cmpH, data, new Date(predDate + 'T12:00:00'));
  const refPct = isToday ? livePct : null;
  const baseline = cmp.baseline;
  const avgDelta = (baseline != null && refPct != null) ? Math.round(refPct - baseline) : null;

  if (avgDelta != null) {
    const absDelta = Math.abs(avgDelta);
    const higher = avgDelta > 0;

    // Sentence case, kept identical to RSFApp2.0's computeComparison verdicts.
    let verdict, verdictClass;
    if (absDelta > 15) {
      verdict = higher ? 'Much busier' : 'Much quieter';
      verdictClass = higher ? 'much-busier' : 'much-quieter';
    } else if (absDelta > 6) {
      verdict = higher ? 'Busier' : 'Quieter';
      verdictClass = higher ? 'busier' : 'quieter';
    } else if (absDelta > 3) {
      verdict = higher ? 'A bit busier' : 'A bit quieter';
      verdictClass = higher ? 'bit-busier' : 'bit-quieter';
    } else {
      verdict = 'About average';
      verdictClass = 'average';
    }

    // At exactly 0 the above/below split has nothing to describe, and
    // "0% below usual" reads as a rendering bug rather than a dead-on match.
    // Kept identical to RSFApp2.0's computeComparison deltaText.
    const deltaText = absDelta === 0
      ? '0% right on usual'
      : `${absDelta}% ${higher ? 'above' : 'below'} usual`;

    compVerdictEl.textContent = verdict;
    compVerdictEl.className = `card-value comp-verdict ${verdictClass}`;
    compVerdictEl.style.color = '';
    compDeltaEl.innerHTML = `<span class="comp-verdict ${verdictClass}">${deltaText}</span>`;
  } else {
    compVerdictEl.textContent = '—';
    compVerdictEl.className = 'card-value comp-verdict';
    compVerdictEl.style.color = 'var(--sub)';
    compDeltaEl.textContent = '';
  }
}

// ── Boot ───────────────────────────────────────────────────────
async function init() {
  // chart.js loads with `defer`, so it isn't available until DOMContentLoaded
  // (which gates this init call). Register plugins here, not at parse time.
  Chart.register(capacityGradientPlugin, nowLinePlugin, scrubLinePlugin);
  updateStatusBar();
  // Live capacity is server-cached for 30s (see api/live-capacity.js), so
  // polling any faster than that just re-fetches the same cached value.
  setInterval(updateStatusBar, 30000);

  const today     = todayPT();
  const yesterday = shiftDate(today, -1);

  let predRows, actualsRows, todaySummaryRows;
  try {
    [predRows, actualsRows, todaySummaryRows] = await Promise.all([
      // First paint only needs the visible pills (today .. today+4). The rest
      // of the 90-day horizon (calendar "More" days) loads in the background
      // below so it can't slow the initial render.
      sbFetch(`predictions?select=slot_ts,pct&slot_ts=gte.${today}T00:00:00&slot_ts=lte.${shiftDate(today, 4)}T23:59:59&order=slot_ts.asc&limit=10000`),
      sbFetch(`capacity_log?timestamp=gte.${yesterday}T12:00:00Z&order=timestamp.asc&limit=2000`),
      sbFetch(`today_summary?date=eq.${today}&select=similarity_preds,blend_weight,computed_at`),
    ]);
  } catch (e) {
    console.error('Supabase load failed:', e);
    document.body.classList.remove('loading');
    showDataWarning(`Could not load gym data: ${e.message}`);
    return;
  }

  // Only feeds the small "compared to usual X" card, not the main charts --
  // fetched outside the Promise.all above so a slow/failed weekly_averages
  // query (see migrations/004_weekly_averages_perf_fix.sql) can't block the
  // rest of the page.
  let weeklyRows = [];
  try {
    weeklyRows = await sbFetch(`weekly_averages?select=*&limit=10000`);
    // An empty-but-successful response is NOT "no data yet" -- the nightly
    // build always writes ~4.5k rows. It means the browser's anon role can
    // read the table but every row is filtered away, i.e. RLS is enabled with
    // no SELECT policy (this happened 2026-08-13, fixed by migration 007).
    // The catch below can't see that case, so it blanked the card silently.
    if (weeklyRows.length === 0) {
      console.warn(
        'weekly_averages returned 0 rows to the anon key — the comparison card ' +
        'will show "—". The nightly build writes ~4,500 rows, so this is almost ' +
        'certainly RLS enabled without a SELECT policy. See ' +
        'migrations/007_weekly_averages_anon_read.sql.'
      );
    }
  } catch (e) {
    console.error('weekly_averages load failed (comparison card will show "—"):', e);
  }

  const predictions = {};
  predRows.forEach(r => { predictions[slotTsToKey(r.slot_ts)] = r.pct; });

  const weekly = {};
  weeklyRows.forEach(r => {
    const disp = RANGE_DB_TO_DISPLAY[r.range_type] || r.range_type;
    const key  = `${r.day_of_week}|${disp}|${r.semester_only}`;
    if (!weekly[key]) weekly[key] = [];
    weekly[key].push({ x: r.hour_slot, y: r.avg_pct, label: slotToLabel(r.hour_slot) });
  });
  Object.values(weekly).forEach(arr => arr.sort((a, b) => a.x - b.x));

  const ts = todaySummaryRows[0] || {};

  const data = {
    predictions,
    weekly,
    today_actuals:           buildTodayActuals(actualsRows, today),
    today_similarity_preds:  ts.similarity_preds || [],
    today_blend_weight:      ts.blend_weight || 0,
  };

  if (Object.keys(predictions).length === 0) {
    showDataWarning('Prediction data is unavailable — the daily build may not have run yet.');
  }

  // predDate follows the day pills; bootDate is pinned to the day this page
  // actually loaded, so refreshTodayData() can tell "user is browsing Friday"
  // apart from "the clock rolled past midnight".
  predDate = today;
  bootDate = today;

  window._insightData = data;

  // Render day pills
  renderPills(data);

  // Calendar popup
  const calPopup = document.getElementById('cal-popup');
  const minDate  = today;
  const maxDate  = shiftDate(today, 90);
  let calYear, calMonth;

  function renderCalendar() {
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const prevMonthHasDays = new Date(calYear, calMonth - 1, 28) >= new Date(minDate + 'T00:00:00');
    const nextMonthHasDays = new Date(calYear, calMonth + 1, 1) <= new Date(maxDate + 'T00:00:00');

    let html = `<div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev-month" ${!prevMonthHasDays ? 'disabled' : ''}>←</button>
      <span class="cal-month-label">${months[calMonth]} ${calYear}</span>
      <button class="cal-nav-btn" id="cal-next-month" ${!nextMonthHasDays ? 'disabled' : ''}>→</button>
    </div>
    <div class="cal-grid">`;
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => html += `<div class="cal-dow">${d}</div>`);
    for (let i = 0; i < firstDay; i++) html += `<div class="cal-day cal-day-empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const disabled = ds < minDate || ds > maxDate;
      const selected = ds === predDate;
      const isToday  = ds === today;
      const cls = ['cal-day', disabled ? 'cal-day-disabled' : '', selected ? 'cal-day-selected' : '', isToday ? 'cal-day-today' : ''].filter(Boolean).join(' ');
      html += `<div class="${cls}" data-date="${ds}">${d}</div>`;
    }
    html += '</div>';
    calPopup.innerHTML = html;

    document.getElementById('cal-prev-month').addEventListener('click', () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); });
    document.getElementById('cal-next-month').addEventListener('click', () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); });
    calPopup.querySelectorAll('.cal-day:not(.cal-day-disabled):not(.cal-day-empty)').forEach(el => {
      el.addEventListener('click', () => {
        predDate = el.dataset.date;
        calPopup.style.display = 'none';
        updatePredChart(data);
        renderInsightCards(data);
        updatePillStates();
      });
    });
  }

  // Paired with the document-level pointerdown dismiss below: without this the
  // trigger's own tap would bubble up, close the popup, and then the click
  // handler would immediately re-open it, so tapping "More" while open could
  // never close it.
  document.getElementById('day-pills').addEventListener('pointerdown', (e) => {
    if (e.target.closest('#cal-trigger')) e.stopPropagation();
  });

  document.getElementById('day-pills').addEventListener('click', (e) => {
    const calTrigger = e.target.closest('#cal-trigger');
    if (!calTrigger) return;
    e.stopPropagation();
    if (calPopup.style.display !== 'none') { calPopup.style.display = 'none'; return; }
    const d = new Date(predDate + 'T12:00:00');
    calYear = d.getFullYear(); calMonth = d.getMonth();
    renderCalendar();
    const pillsEl = document.getElementById('day-pills');
    const rect = pillsEl.getBoundingClientRect();
    const sectionRect = document.getElementById('section-predict').getBoundingClientRect();
    calPopup.style.top  = (rect.bottom - sectionRect.top + 8) + 'px';
    calPopup.style.right = '0';
    calPopup.style.left = 'auto';
    calPopup.style.display = 'block';
  });

  // pointerdown, not click: Safari on iOS doesn't deliver click from taps on
  // non-interactive elements, so tapping the page background to dismiss the
  // calendar silently did nothing on an iPhone. pointerdown fires identically
  // for desktop mouse input.
  document.addEventListener('pointerdown', () => { calPopup.style.display = 'none'; });
  calPopup.addEventListener('pointerdown', e => e.stopPropagation());
  calPopup.addEventListener('click', e => e.stopPropagation());

  updatePredChart(data);
  renderInsightCards(data);

  document.body.classList.remove('loading');

  // Two triggers, because neither covers the other. The interval handles a
  // tab left open in the foreground (visibilitychange never fires there);
  // the visibility handler catches the backgrounded-tab case, where browsers
  // throttle timers hard enough that a tab can sit hours behind. New
  // capacity_log rows only land every 15 min, so 5 min is well inside the
  // useful resolution without polling for its own sake.
  setInterval(refreshTodayData, 5 * 60 * 1000);

  // No single event covers every way a tab comes back into view, so listen for
  // all three and let refreshTodayData() de-dupe. visibilitychange misses
  // app/window switches where the tab never technically hides; focus misses
  // same-window tab switches; mobile Safari can restore from bfcache and fire
  // only pageshow. Live capacity and the curve refresh together here so the
  // dot can't jump to a new value while the line it sits on stays behind.
  // init() just loaded all of this, and pageshow fires on first load too, so
  // start the cooldown here to stop the boot pageshow re-fetching immediately.
  lastRefreshAt = Date.now();

  const wake = async () => {
    if (document.visibilityState === 'hidden') return;
    // Settle both before the final render so the live % and the forecast the
    // trend card subtracts it from always describe the same moment.
    await Promise.allSettled([updateStatusBar(), refreshTodayData()]);
    if (window._insightData) renderInsightCards(window._insightData);
  };
  document.addEventListener('visibilitychange', wake);
  window.addEventListener('focus', wake);
  window.addEventListener('pageshow', wake);

  // Background-load the rest of the 90-day horizon (calendar "More" days) after
  // first paint. Merges into the same `predictions` object the rendered view
  // already references, then re-renders so a day the user may have navigated to
  // via the calendar fills in automatically once it arrives.
  sbFetch(`predictions?select=slot_ts,pct&slot_ts=gte.${shiftDate(today, 5)}T00:00:00&slot_ts=lte.${shiftDate(today, 92)}T23:59:59&order=slot_ts.asc&limit=10000`)
    .then(rows => {
      rows.forEach(r => { predictions[slotTsToKey(r.slot_ts)] = r.pct; });
      updatePredChart(data);
      renderInsightCards(data);
    })
    .catch(e => console.error('background predictions load failed:', e));
}

// chart.js is loaded with `defer`, which executes before DOMContentLoaded but
// after this inline script parses. Gating init on DOMContentLoaded guarantees
// the Chart global exists before updatePredChart runs.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
