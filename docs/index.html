<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the page paint under the notch and home
       indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bear Meter</title>

  <!-- Without this the mobile address bar renders white above a #0a0a0f page. -->
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bear Meter">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Tab, home screen and installed app all carry the bear, the same mark the
       iOS app ships. Every icon here is resized from ONE source, the 1024px
       original in RSFApp2.0's AppIcon.appiconset — regenerate from that rather
       than from one of these, or the two platforms drift.

       The manifest's maskable entry is a SEPARATE, padded file. Android crops a
       maskable icon to whatever shape the launcher uses, keeping only the inner
       80%, and this bear's ears sit right on that boundary. Full-bleed art in
       that slot loses them to a circular mask. apple-touch-icon needs the
       opposite: iOS rounds the corners itself, so it gets the full-bleed
       square. -->
  <link rel="icon" type="image/png" href="/icon-256.png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://njhxcwcvyorwqlfacnal.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="loading">

<div id="data-warning"></div>

<header>
  <div class="logo">Bear Meter</div>
  <a href="about.html" class="about-link">About</a>
</header>

<main>

  <!-- INSIGHT CARDS -->
  <div class="insight-row hidden" id="insight-row">
    <div class="insight-card" id="insight-status">
      <div class="skel-overlay">
        <div class="skel skel-val" style="width:50%;animation-delay:.1s"></div>
        <div class="skel" style="width:100%;height:7px;animation-delay:.15s"></div>
        <div class="skel" style="width:40%;height:12px;animation-delay:.2s"></div>
      </div>
      <div class="val-row">
        <span class="live-dot" id="insight-live-dot"></span>
        <span class="card-value" id="insight-pct">&mdash;</span>
        <span class="card-label" id="insight-pct-tag"></span>
      </div>
      <div class="cap-bar-wrap">
        <div class="cap-bar-track"><div class="cap-bar-fill" id="insight-cap-fill" style="width:0%"></div></div>
      </div>
      <span class="card-sub" id="insight-cap-label">&mdash;</span>
    </div>

    <div class="insight-card" id="insight-trend">
      <div class="skel-overlay">
        <div class="skel skel-val" style="width:45%;animation-delay:.1s"></div>
        <div class="skel" style="width:35%;height:14px;animation-delay:.15s"></div>
      </div>
      <span class="card-value" id="insight-trend-val">&mdash;</span>
      <span class="card-sub" id="insight-trend-sub"></span>
    </div>

    <div class="insight-card" id="insight-comparison">
      <div class="skel-overlay">
        <div class="skel skel-val" style="width:55%;animation-delay:.1s"></div>
        <div class="skel" style="width:45%;height:14px;animation-delay:.15s"></div>
      </div>
      <span class="card-value" id="insight-comp-verdict">&mdash;</span>
      <span class="card-sub" id="insight-comp-delta"></span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- PREDICTION CHART -->
  <div class="chart-section" id="section-predict">
    <div class="chart-header">
      <div class="chart-title-wrap">
        <h2 class="chart-title" id="chart-title">Today's Crowd</h2>
        <button type="button" class="info-dot" id="chart-info"
                data-tip="Predictions update every 15 minutes."
                aria-label="Predictions update every 15 minutes.">i</button>
      </div>
      <div class="day-pills" id="day-pills"></div>
    </div>
    <div id="cal-popup" class="cal-popup" style="display:none"></div>
    <div class="chart-wrap">
      <canvas id="pred-chart"></canvas>
      <div id="chart-closed" class="chart-closed" style="display:none"></div>
      <div id="pulse-dot" class="pulse-dot" style="display:none"></div>
      <div id="pred-tooltip" class="chart-tooltip"></div>
    </div>
  </div>


</main>

<script defer src="/js/quality.js"></script>
<script defer src="/js/data.js"></script>
<script defer src="/js/calendar.js"></script>
<script defer src="/js/chart.js"></script>
<script defer src="/js/cards.js"></script>
<script defer src="/js/app.js"></script>
</body>
</html>
