# Default `pytest` run = the live suite, and nothing else.
#
# legacy/ holds the frozen Random Forest pipeline (retired 2026-09-09). Its two
# tests still import scikit-learn, which is no longer in requirements.txt, so
# collecting them turns a bare `pytest` into an ImportError. They stay runnable
# on purpose: `pip install scikit-learn && pytest legacy/` still works, because
# norecursedirs only skips directory *recursion*, not an explicit path.
[pytest]
norecursedirs = legacy .git __pycache__ node_modules docs migrations api
