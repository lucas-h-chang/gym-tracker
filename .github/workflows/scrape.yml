# Despite the name, this workflow no longer takes the reading. The 15-minute
# scrape moved to api/scrape.js on Vercel on 2026-08-13 (GitHub Actions has to
# allocate a runner first, and on 2026-08-06 that queue backed up 8-17 minutes
# and lost readings permanently). The `Scrape live count -> Supabase` step ran
# scraper.py in parallel with Vercel as a trial and was removed on 2026-08-31:
# it was writing a second row per tick, and because scraper.py omits sensor_ok
# (migration 008 defaults it to true) every stalled reading Vercel correctly
# flagged came with a clean duplicate, halving the guard. The doubled cadence
# also halved api/_sensor.js's STALL_RUN lookback from ~90 min to ~37 min.
#
# What is left here recomputes from data already in Supabase, so a runner delay
# costs nothing. The filename stays put because cron-job.org dispatches by it.
name: Scrape Gym Data

on:
  workflow_dispatch:  # triggered externally by cron-job.org every 15 minutes

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-scrape-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install requests supabase pandas numpy pytz cryptography httpx[http2]

      - name: Build today similarity preds → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python today_builder.py

      - name: Send workout reminder pushes
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APNS_KEY_P8:          ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID:          ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID:         ${{ secrets.APNS_TEAM_ID }}
        run: python send_workout_notifications.py
