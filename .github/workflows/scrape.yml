name: Scrape Gym Data

# NOTE: the 15-minute READING is NOT taken here. api/scrape.js on Vercel owns it
# (since 2026-08-13, commit 24878b1). The scraper.py step that used to live in
# this file was removed 2026-08-24: its Vercel replacement had been failing on a
# bad SUPABASE_SERVICE_KEY, so Actions silently kept scraping and the migration
# never actually took effect. This workflow now only runs the DERIVED builders,
# which recompute from Supabase and so tolerate runner-queue delay.
on:
  workflow_dispatch:  # triggered externally by cron-job.org every 15 minutes

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-scrape-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install requests supabase pandas numpy pytz cryptography httpx[http2]

      - name: Build today similarity preds → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python today_builder.py

      - name: Send workout reminder pushes
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APNS_KEY_P8:          ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID:          ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID:         ${{ secrets.APNS_TEAM_ID }}
        run: python send_workout_notifications.py
