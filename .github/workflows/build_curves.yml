name: Build Curve Model

on:
  schedule:
    - cron: '0 10 * * 0'  # Sunday ~03:00 PT (10:00 UTC, approximate across DST)
  workflow_dispatch:        # manual "Run" button to rebuild on demand

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out this repo
        uses: actions/checkout@v3
        with:
          # Full history: the push step below rebases onto origin/main when a
          # concurrent push beats it, and rebase on a shallow clone is fragile.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build curve table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python build_curves.py

      # Fits the within-day level correction against the SAME curve table just
      # built, plus predictions_builder's 28-day trailing layer. Must run after
      # build_curves.py: it is fitted against the baseline production serves,
      # and fitting it against a stale curve would mis-size the coefficients.
      - name: Build carry table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python build_carry.py

      - name: Sanity-check the built curves
        run: python -m pytest test_curve_sanity.py test_calendar_mirrors.py test_carry.py -v

      - name: Commit and push
        run: |
          git config user.name "Automated Robot"
          git config user.email "actions@users.noreply.github.com"
          git add models/curves.json models/curve_metrics.json models/carry.json
          git commit -m "Rebuilt curve model" || exit 0

          # Retry onto a moving main. This job takes minutes, and anything that
          # lands on main meanwhile turns a bare `git push` into "! [rejected]
          # (fetch first)". The runner is ephemeral, so a failed push does not
          # just fail the step, it DISCARDS the rebuilt curves.json and
          # carry.json entirely and the model silently stays stale until
          # somebody notices. That happened on 2026-09-08.
          #
          # models/*.json are wholly generated and nothing else writes them, so
          # rebasing our artifact commit onto the newer main is safe. A genuine
          # conflict means someone hand-edited a built artifact, which should
          # stop the job loudly rather than be auto-resolved.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt, rebasing onto origin/main"
            git fetch origin main || exit 1
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "still could not push after 5 attempts"
          exit 1

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Weekly curve rebuild FAILED — ${new Date().toISOString().slice(0,10)}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
