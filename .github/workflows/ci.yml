# Fast, secret-free test run on every push. The scheduled builds (build_curves,
# daily) only run weekly/nightly, so before this existed a calendar mirror could
# drift for days before anything noticed — which is exactly what happened when
# the 2026-08 closure work reached four of the five mirrors and missed
# TimeUtils.swift.
#
# Nothing here touches Supabase, so no secrets and no risk of a test run
# mutating production data.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run all live Python tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: API, contract, and transactional SQL tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:browser
